[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "q2-periobiome"
dynamic = ["version"]
description = "QIIME 2 plugin: Socransky complexes and dysbiosis indices for subgingival 16S rRNA data."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Fabiano Menegidio", email = "fmenegidio@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
# qiime2 and q2-types are distributed through the QIIME 2 conda channel,
# not PyPI; they are declared in environment.yml.
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "biom-format",
    "jinja2"
]

[project.urls]
Homepage = "https://labiomics.github.io/q2-periobiome/"
Repository = "https://github.com/LaBiOmicS/q2-periobiome"

[project.entry-points."qiime2.plugins"]
"q2-periobiome" = "q2_periobiome.plugin_setup:plugin"

[tool.setuptools.dynamic]
version = { attr = "q2_periobiome._version.__version__" }

[tool.setuptools.packages.find]
include = ["q2_periobiome*"]

[tool.setuptools.package-data]
q2_periobiome = [
    "citations.bib",
    "data/*.tsv",
    "assets/web/*.html",
    "assets/web/css/*",
    "assets/web/js/*",
    "tests/data/*"
]

[tool.flake8]
max-line-length = 99
exclude = [".git", "__pycache__", "build", "dist", "*.egg-info",
           "q2_periobiome/assets", "validation/search"]

[tool.pytest.ini_options]
testpaths = ["q2_periobiome", "validation/analysis/tests"]

[tool.coverage.run]
source = ["q2_periobiome"]
omit = ["q2_periobiome/tests/*"]
